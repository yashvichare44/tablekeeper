<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tablekeeper</title>
  <style>
    :root {
      --bg: #14110f;
      --panel: #1f1a16;
      --ink: #f4efe8;
      --muted: #b7a99a;
      --line: #3a322b;
      --accent: #d9773a;
      --good: #7dce8a;
      --bad: #ef6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      background: radial-gradient(1200px 600px at 10% -10%, #2a211b, var(--bg));
      color: var(--ink);
    }
    header, main { max-width: 1100px; margin: 0 auto; padding: 24px; }
    header h1 { margin: 0 0 6px; letter-spacing: 0.04em; }
    header p { margin: 0; color: var(--muted); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    input, select, button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #2a241f;
      color: var(--ink);
      font: inherit;
    }
    button {
      margin-top: 16px;
      background: var(--accent);
      border: 0;
      color: #1a120c;
      font-weight: 700;
      cursor: pointer;
    }
    .tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .table {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
    }
    .table.selected { outline: 2px solid var(--accent); }
    .table.busy { opacity: 0.45; }
    .ok { color: var(--good); }
    .err { color: var(--bad); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <h1>Tablekeeper</h1>
    <p>A table can be booked once for a window. Concurrent retries do not create a second seat.</p>
  </header>
  <main class="grid">
    <section class="card">
      <h2>New booking</h2>
      <label>Guest</label>
      <input id="guest" placeholder="Ada Lovelace" />
      <label>Party size</label>
      <input id="party" type="number" min="1" value="2" />
      <label>Start</label>
      <input id="start" type="datetime-local" />
      <label>Timezone</label>
      <input id="tz" value="America/Los_Angeles" />
      <label>Duration (minutes)</label>
      <input id="mins" type="number" value="90" />
      <div id="tables" class="tables"></div>
      <button id="book">Hold the table</button>
      <p id="status"></p>
    </section>
    <section class="card">
      <h2>Booked</h2>
      <table>
        <thead><tr><th>When</th><th>Table</th><th>Guest</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script>
    let selected = null;
    const $ = (id) => document.getElementById(id);
    const start = $("start");
    const now = new Date();
    now.setMinutes(now.getMinutes() + 60 - (now.getMinutes() % 30));
    start.value = now.toISOString().slice(0, 16);

    async function loadTables() {
      const res = await fetch("/api/tables");
      const data = await res.json();
      $("tables").innerHTML = data.tables.map((t) => `
        <div class="table" data-id="${t.id}">
          <strong>${t.name}</strong><br/>
          ${t.capacity} seats · ${t.zone}
        </div>`).join("");
      for (const el of document.querySelectorAll(".table")) {
        el.onclick = () => {
          selected = Number(el.dataset.id);
          document.querySelectorAll(".table").forEach((n) => n.classList.remove("selected"));
          el.classList.add("selected");
        };
      }
    }

    async function loadBookings() {
      const res = await fetch("/api/reservations");
      const data = await res.json();
      $("rows").innerHTML = data.reservations.map((r) => `
        <tr>
          <td>${r.starts_at.replace("T", " ").slice(0, 16)}</td>
          <td>${r.table_name}</td>
          <td>${r.guest_name} · ${r.party_size}</td>
        </tr>`).join("") || `<tr><td colspan="3">No bookings yet</td></tr>`;
    }

    $("book").onclick = async () => {
      $("status").textContent = "";
      if (!selected) {
        $("status").className = "err";
        $("status").textContent = "Pick a table first.";
        return;
      }
      const body = {
        table_id: selected,
        guest_name: $("guest").value,
        party_size: Number($("party").value),
        starts_at: $("start").value,
        timezone: $("tz").value,
        duration_minutes: Number($("mins").value),
      };
      const res = await fetch("/api/reservations", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        $("status").className = "err";
        $("status").textContent = data.detail || "Booking failed";
      } else {
        $("status").className = "ok";
        $("status").textContent = `Held ${data.table_name} for ${data.guest_name}`;
        await loadBookings();
      }
    };

    loadTables();
    loadBookings();
  </script>
</body>
</html>
